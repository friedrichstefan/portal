name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: platform-mesh/.github/.github/workflows/job-node-test.yml@70ae2b114f3e2b2c4c4eff8d32f86efb01a532fa # main
    secrets: inherit # zizmor: ignore[secrets-inherit]

  create-version:
    uses: platform-mesh/.github/.github/workflows/job-create-version.yml@70ae2b114f3e2b2c4c4eff8d32f86efb01a532fa # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: write # Needed to create the version tag/release

  docker-build-push:
    needs: [create-version, test]
    uses: platform-mesh/.github/.github/workflows/job-docker-build-push.yml@70ae2b114f3e2b2c4c4eff8d32f86efb01a532fa # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: write # Needed to update release artifacts
      packages: write # Needed to push the container image to GHCR
      id-token: write # Needed for OIDC-based image signing
    with:
      imageTagName: ghcr.io/platform-mesh/portal
      version: ${{ needs.create-version.outputs.version }}
      multiarch: true

  update-version:
    needs: [create-version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-chart-version-update.yml@70ae2b114f3e2b2c4c4eff8d32f86efb01a532fa # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      appVersion: ${{ needs.create-version.outputs.version }}
      chart: portal
      targetRepository: platform-mesh/helm-charts

  sbom:
    needs: [create-version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-sbom.yml@70ae2b114f3e2b2c4c4eff8d32f86efb01a532fa # main
    permissions:
      contents: read # Needed to read repository contents
      packages: read # Needed to pull the image to generate the SBOM
    with:
      imageReference: ghcr.io/platform-mesh/portal:${{ needs.create-version.outputs.version }}

  image-ocm:
    needs: [create-version, docker-build-push, sbom]
    uses: platform-mesh/.github/.github/workflows/job-image-ocm.yml@70ae2b114f3e2b2c4c4eff8d32f86efb01a532fa # main
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read # Needed to read repository contents
      packages: write # Needed to push the OCM component image to GHCR
    with:
      imageReference: ghcr.io/platform-mesh/portal:${{ needs.create-version.outputs.version }}
      appVersion: ${{ needs.create-version.outputs.version }}
      repoName: portal
      commit: ${{ github.sha }}

  scan-sbom:
    needs: [create-version, docker-build-push, sbom, image-ocm]
    uses: platform-mesh/.github/.github/workflows/job-trivy-sbom.yml@70ae2b114f3e2b2c4c4eff8d32f86efb01a532fa # main
    permissions:
      contents: read # Needed to read repository contents
      packages: read # Needed to pull the image referenced by the SBOM
      security-events: write # Needed to upload Trivy results to code scanning
    with:
      componentVersion: ${{ needs.create-version.outputs.version }}
